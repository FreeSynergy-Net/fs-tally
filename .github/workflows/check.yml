# Runs fmt, clippy (pedantic), tests and the coding rules on every push (fs-release caller, pinned).
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    uses: FreeSynergy-Net/fs-release/.github/workflows/check.yml@e0aa772a12b91f8a37846b4efef5f44a963a6c47
