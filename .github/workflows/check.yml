# Runs fmt, clippy (pedantic), tests and the coding rules on every push (fs-release caller, pinned).
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    uses: FreeSynergy-Net/fs-release/.github/workflows/check.yml@485f74732ddb90965fafcfa37b6a4f6b473dcc6b
